<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adieu Chat</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #77746d;
    --line: #e4e1da; --accent: #1f6f5c; --accent-ink: #ffffff;
    --user: #1f6f5c; --bot: #efece6; --warn: #b4532a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #9a978f;
      --line: #2f2e2b; --accent: #4fb39a; --accent-ink: #0d1f1a;
      --user: #2b7a66; --bot: #2a2927; --warn: #e08a62;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .cid { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  header .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.err { align-self: flex-start; color: var(--warn); border: 1px solid var(--warn); background: transparent; }
  .msg.typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 8px; }
  .chips button { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  form { display: flex; gap: 8px; padding: 12px 20px 18px; border-top: 1px solid var(--line); }
  form input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
               background: var(--panel); color: var(--ink); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px 18px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  dd.empty { color: var(--muted); opacity: .6; }
  dd.req.empty { color: var(--warn); opacity: 1; }
  .day { margin-bottom: 12px; }
  .day h3 { font-size: 14px; margin: 0 0 4px; }
  .day ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .day li span { color: var(--muted); font-size: 12px; }
  pre { font-size: 11px; background: var(--bot); padding: 8px; border-radius: 8px; overflow-x: auto; }
  .hint { color: var(--muted); font-size: 13px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<header>
  <h1>Adieu</h1>
  <span class="cid" id="cid">new conversation</span>
  <span class="spacer"></span>
  <button id="reset">New trip</button>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div class="chips" id="chips">
      <button data-say="Planning a 5 day honeymoon in Bali for 2, budget 4000 dollars, relaxed style">Try: honeymoon in Bali</button>
      <button data-say="Generate my itinerary">Generate my itinerary</button>
      <button data-say="Start over">Start over</button>
    </div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Tell me about your trip..." autofocus>
      <button class="primary" id="send">Send</button>
    </form>
  </section>
  <aside>
    <h2>Traveler profile</h2>
    <dl id="profile"></dl>
    <h2>Itinerary</h2>
    <div id="itinerary"><p class="hint">Not generated yet.</p></div>
    <h2>Last raw response</h2>
    <pre id="raw">(none)</pre>
  </aside>
</main>
<script>
  const API = "/api/chat";
  const REQUIRED = ["destination", "traveler_count", "budget", "duration"];
  const FIELDS = ["destination", "traveler_count", "budget", "duration", "travel_style",
                  "trip_type", "occasion", "relationship_type", "season"];
  let conversationId = null;
  let busy = false;

  const $ = (id) => document.getElementById(id);

  function add(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
    return el;
  }

  function renderProfile(p) {
    p = p || {};
    $("profile").innerHTML = "";
    for (const f of FIELDS) {
      const dt = document.createElement("dt");
      dt.textContent = f.replace(/_/g, " ");
      const dd = document.createElement("dd");
      const v = p[f];
      const empty = v === null || v === undefined || v === "";
      dd.textContent = empty ? (REQUIRED.includes(f) ? "needed" : "-") : v;
      dd.className = (empty ? "empty " : "") + (REQUIRED.includes(f) ? "req" : "");
      $("profile").append(dt, dd);
    }
  }

  function renderItinerary(it) {
    const box = $("itinerary");
    if (!it) { box.innerHTML = '<p class="hint">Not generated yet.</p>'; return; }
    box.innerHTML = "";
    const h = document.createElement("p");
    h.innerHTML = "<strong></strong>";
    h.firstChild.textContent = it.destination;
    box.appendChild(h);
    for (const d of it.days || []) {
      const day = document.createElement("div");
      day.className = "day";
      const t = document.createElement("h3");
      t.textContent = "Day " + d.day_number;
      const ul = document.createElement("ul");
      for (const a of d.activities || []) {
        const li = document.createElement("li");
        li.textContent = a.name + " ";
        const s = document.createElement("span");
        s.textContent = "(" + a.category + ")" + (a.description ? " " + a.description : "");
        li.appendChild(s);
        ul.appendChild(li);
      }
      day.append(t, ul);
      box.appendChild(day);
    }
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; $("send").disabled = true;
    add(text, "user");
    const typing = add("thinking...", "bot typing");
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: conversationId, message: text }),
      });
      const raw = await res.text();
      typing.remove();
      if (!res.ok) {
        add("Backend error " + res.status + ": " + raw.slice(0, 400) +
            "\n(Check the uvicorn terminal for the traceback.)", "err");
        $("raw").textContent = raw;
        return;
      }
      const data = JSON.parse(raw);
      conversationId = data.conversation_id;
      $("cid").textContent = conversationId;
      add(data.assistant_message, "bot");
      renderProfile(data.profile);
      renderItinerary(data.itinerary);
      $("raw").textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      typing.remove();
      add("Could not reach the UI server or backend: " + e.message, "err");
    } finally {
      busy = false; $("send").disabled = false; $("input").focus();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("input").value; $("input").value = ""; send(v);
  });
  $("chips").addEventListener("click", (e) => {
    const say = e.target.dataset && e.target.dataset.say;
    if (say) send(say);
  });
  $("reset").addEventListener("click", () => {
    conversationId = null;
    $("cid").textContent = "new conversation";
    $("log").innerHTML = "";
    renderProfile(null); renderItinerary(null);
    $("raw").textContent = "(none)";
    add("Hi! Where are you dreaming of going, and what kind of trip is it?", "bot");
  });

  renderProfile(null);
  add("Hi! Where are you dreaming of going, and what kind of trip is it?", "bot");
</script>
</body>
</html>
