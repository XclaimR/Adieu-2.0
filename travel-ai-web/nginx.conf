# Per-IP request limit on the API, against floods and scripts. Per-traveler turn limits live in the API.
# Generous burst: a page of photos goes through /api too. Behind another proxy, every client shares its IP:
# set_real_ip_from that proxy so this still counts per visitor.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many;
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    # Local models can take a while to answer.
    proxy_read_timeout 600s;  # an LLM call plus its one retry can take 2 x 240s
    # Stream turn events to the browser as they happen.
    proxy_buffering off;
  }

  location @too_many {
    default_type application/json;
    return 429 '{"detail": "That\'s a lot at once — give me a moment, then try again."}';
  }

  location / {
    try_files $uri /index.html;
  }
}
