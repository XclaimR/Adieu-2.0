# Production override: only Caddy (HTTPS on 80/443) is reachable; Postgres, the API and nginx stay on the
# Compose network. Run through ./deploy.sh, see docs/DEPLOY.md.
services:

  postgres:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      APP_ENV: production
      ALLOW_DEV_LOGIN: "false"
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}

  web:
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: travel-ai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
