# Production only (mounted by docker-compose.prod.yml): Caddy is the only client nginx sees, so take the
# visitor's address from the X-Forwarded-For header Caddy sets, and per-IP limits count each visitor.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
