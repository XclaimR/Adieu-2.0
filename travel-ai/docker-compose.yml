services:

  postgres:
    image: postgres:17

    container_name: travel-ai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      # Only read when the volume is first created; changing it later needs ALTER USER too.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: travel_ai

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .

    image: travel-ai-api

    container_name: travel-ai-api

    restart: unless-stopped

    env_file: .env

    environment: &api_env
      # production refuses to start with default secrets or dev sign-in; set APP_ENV=development locally.
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/travel_ai
      # Ollama runs on the host. To use a hosted model instead, set LLM_BASE_URL,
      # LLM_MODEL and LLM_API_KEY in .env (any OpenAI-compatible provider).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      # Sign in without Google while developing locally.
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  # Tests and eval runners (the api image ships without them). Only built on demand:
  #   docker compose run --rm --build tests                      # unit tests
  #   docker compose run --rm tests python -m tests.personas.run --base-url http://api:8000
  tests:
    build:
      context: .
      target: test

    image: travel-ai-test

    profiles: ["test"]

    env_file: .env

    environment: *api_env

  web:
    build: ../travel-ai-web

    image: travel-ai-web

    container_name: travel-ai-web

    restart: unless-stopped

    ports:
      # Loopback only: dev sign-in accepts any email, so never publish this to the network.
      # In production a reverse proxy with TLS on the host forwards to it.
      - "127.0.0.1:8080:80"

    depends_on:
      - api

volumes:
  postgres_data:
