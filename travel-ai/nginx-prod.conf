# Production only (mounted by docker-compose.prod.yml).
# Visitors arrive through Tailscale Funnel's proxy on the Mac, then Docker's port forward: take their
# address from the last X-Forwarded-For entry (the one Funnel adds, not one the visitor sent) so per-IP
# limits count each visitor. Only Docker's private networks (the host's forward) are trusted to set it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
server_tokens off;
